name: CI

on:
  push:
    # INVARIANT: this list is `main` plus every SUPPORTED line in docs/ops/multiloader.md.
    # Archived lines (`v1.18.x`, `1.19`) are deliberately absent — an archive gets no CI, no
    # releases and no cherry-picks, and a branch nobody builds must not look supported.
    #
    # `v1.21.1` is listed before its branch exists on purpose: a `push` filter for a missing
    # branch simply never fires, so declaring the supported set here means the line is already
    # wired the moment #54 cuts it. Do not "clean this up".
    branches: [ main, v1.21.11, v1.21.1 ]
    # A docs-only change cannot break the build, so don't spend a runner on it.
    # `.github/**` is deliberately NOT ignored — a workflow change must run the workflow.
    # The list is duplicated below on purpose: GitHub Actions does not reliably support
    # YAML anchors, so keep the two lists in sync by hand.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.sdkmanrc'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    # Keep in sync with the `push` list above by hand — see the note there.
    branches: [ main, v1.21.11, v1.21.1 ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.sdkmanrc'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Fabric Loom does not run on JDK 22+. 21 is what 1.21.11 targets.
        java: [ 21 ]
        # Build on both: Loom and the resource paths behave differently on Windows.
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      # Runs the layer-1 tests too: `test` is wired into `build`, so a failing unit test
      # fails here. See docs/strategy/testing.md.
      - name: build and unit test
        run: ./gradlew build

      # Layer 2. A separate step because it starts a real headless server, and because a
      # unit-test failure and a gametest failure should not look like the same thing in the
      # checks list. No display needed — it is a dedicated server, and the gametest runner
      # does not ask for the EULA.
      - name: server gametests
        run: ./gradlew runGametest

      # Both layers write JUnit XML, so the reports are worth keeping whichever way the run
      # went — on a red run they are the only place the failure is spelled out.
      - name: capture test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ runner.os }}-java${{ matrix.java }}
          path: |
            build/test-results/test/**/*.xml
            build/reports/tests/test/**
            build/gametest/report.xml
          if-no-files-found: warn

      - name: capture build artifacts
        # Only from one OS, so the artifact name stays unique.
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-java${{ matrix.java }}
          path: build/libs/
