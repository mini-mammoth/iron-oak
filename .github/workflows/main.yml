name: CI

on:
  push:
    branches: [ main, v1.18.x ]
    # A docs-only change cannot break the build, so don't spend a runner on it.
    # `.github/**` is deliberately NOT ignored — a workflow change must run the workflow.
    # The list is duplicated below on purpose: GitHub Actions does not reliably support
    # YAML anchors, so keep the two lists in sync by hand.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.sdkmanrc'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main, v1.18.x ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.sdkmanrc'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Fabric Loom does not run on JDK 22+. 21 is what 1.21.11 targets.
        java: [ 21 ]
        # Build on both: Loom and the resource paths behave differently on Windows.
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        # Only from one OS, so the artifact name stays unique.
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-java${{ matrix.java }}
          path: build/libs/
