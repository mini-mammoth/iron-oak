name: Release

# Publishes the jar to Modrinth and CurseForge.
#
# The trigger is a *published* GitHub Release, not a tag push: the release body is the
# changelog both platforms show, so there has to be a human-written body before anything
# is uploaded. Creating a draft release is therefore safe — nothing publishes until you
# hit "Publish release".
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate the upload without publishing anything'
        type: boolean
        default: true
      release_type:
        description: 'Release channel on both platforms'
        type: choice
        options: [ STABLE, BETA, ALPHA ]
        default: STABLE

# Two runs uploading the same version would create duplicate files on both platforms,
# and neither API is idempotent. Never cancel in progress: a half-cancelled upload is
# worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Same JDK as the CI build. Loom does not run on JDK 22+, so this pin is load
      # bearing, not cosmetic.
      - name: setup jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      # Withholding the tokens is what makes a dry run a dry run: build.gradle turns on
      # dryRun for a platform whose token is absent, so there is no second switch to
      # forget.
      #
      # Deliberately two steps rather than one with a conditional token. In a GitHub
      # expression `inputs.dry_run && '' || secrets.X` evaluates to the secret, because
      # '' is falsy and the `||` therefore takes over — a dry run would have published
      # for real. Two steps cannot be read wrong.
      - name: publish (dry run, no tokens)
        if: ${{ inputs.dry_run }}
        run: ./gradlew publishMods -Ppublish_type=${{ inputs.release_type }}

      # The release body becomes the changelog on both platforms. On a manual dispatch
      # there is no release, so build.gradle falls back to a link.
      - name: publish
        if: ${{ !inputs.dry_run }}
        run: ./gradlew publishMods -Ppublish_type=${{ inputs.release_type || 'STABLE' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      # On a dry run these are the payloads that *would* have been uploaded — the point
      # of the exercise, so keep them.
      - name: capture publish artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ github.run_id }}
          path: |
            build/libs/
            build/publishMods/
          if-no-files-found: warn
