# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.3

# Architectury Properties (#70 — phase 1 of #21)
# dev.architectury.loom replaces net.fabricmc.fabric-loom-remap. Architectury Loom and
# Fabric Loom share the same 1.17.x version line and codebase, so this tracks the
# fabric-loom-remap version above rather than Architectury's own (stale, Gradle-8-era)
# per-Minecraft-line "1.6" branch tag. Check releases on https://maven.architectury.dev/.
# 1.21.1 is obfuscated, so this stays the plain (non "-no-remap") plugin — see the comment
# on `mappings loom.officialMojangMappings()` in fabric/build.gradle.
loom_version=1.17.491
architectury_plugin_version=3.5-SNAPSHOT
architectury_api_version=13.0.11
# No "neoforge" yet — that is phase 3 of #21. common/'s platform list drives which
# platform-specific configurations (e.g. transformProductionFabric) it exposes.
enabled_platforms=fabric

# Mod Properties
mod_version=1.3.0+1.21.1
maven_group=com.mini-mammoth
archives_base_name=iron-oak

# Dependencies
fabric_version=0.116.15+1.21.1

# Publishing
# Modrinth project id — https://modrinth.com/mod/iron-oak
modrinth_id=6SNkq6Ss
# CurseForge NUMERIC project id, shown in the sidebar of the project page.
# Leave empty to skip CurseForge entirely; Modrinth still publishes on its own.
curseforge_id=550871
# Game versions this release is announced for. Comma-separated, no spaces.
# Not derived from minecraft_version: a jar often loads on more versions than it was
# built against, and CurseForge/Modrinth spell snapshots differently.
publish_game_versions=1.21.1
# STABLE | BETA | ALPHA — override per run with -Ppublish_type=BETA
publish_type=STABLE
